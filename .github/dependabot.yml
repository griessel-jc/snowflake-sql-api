version: 2
updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # The [dev] black cap tracks the black rev pinned in
      # .pre-commit-config.yaml, and the two move together by hand. A
      # Dependabot bump of the cap alone splits CI from the local hook.
      # Name-only on purpose: the cap is a range with no pinned version, so an
      # update-types ignore would match nothing. A name-only ignore does not
      # block security updates. Black's security fixes since 25.9.0 need
      # Python 3.10+, so a security PR for it is a decision about the 3.9
      # floor and the hook rev, not a plain merge.
      - dependency-name: "black"

  # GitHub Actions used by the CI and publish workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
