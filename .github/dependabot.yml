version: 2
updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # The [dev] black cap tracks the black rev pinned in
      # .pre-commit-config.yaml, and the two move together by hand. A
      # Dependabot bump of the cap alone splits CI from the local hook.
      # Name-only on purpose: an update-types ignore is computed from the first
      # X.Y.Z version in the requirement, and `>=26.5,<26.6` has none, so it
      # would match nothing. Security updates are not blocked by it: in
      # dependabot-core, IgnoreCondition#ignored_versions returns early for
      # security_updates_only with just the explicit `versions`, and a
      # name-only ignore has none. Security updates are off for this repo,
      # though, so a black advisory has to be caught by hand, and the fix
      # moves the hook rev in .pre-commit-config.yaml alongside the cap.
      - dependency-name: "black"

  # GitHub Actions used by the CI and publish workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
