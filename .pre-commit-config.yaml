# Pre-commit hooks for snowflake-sql-api. Install with `pre-commit install`
# (the hook then runs on every commit); run the full set with
# `pre-commit run --all-files`. The black rev is pinned to match the `[dev]`
# black cap in pyproject.toml (see its comment); the other revs are set here
# independently of the `[dev]` floors.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check

  - repo: https://github.com/psf/black
    # Kept in sync with the [dev] cap in pyproject.toml (<26.6); move both
    # together by hand.
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      # Keypair auth: belt-and-braces with the *.p8 / *.pem .gitignore rules.
      - id: detect-private-key

  # mypy runs as a local hook (not the mirror) so it resolves project imports
  # and stubs from the installed dev environment, matching the CI invocation.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy snowflake_sql_api
        language: system
        types: [python]
        pass_filenames: false
